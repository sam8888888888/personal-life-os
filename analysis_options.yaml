# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # ── Tambahan hasil audit 23 Sep 2026 (P3-8) ──────────────────────────
    # Aturan di bawah adalah yang pada kode saat ini sudah bersih, jadi
    # langsung menjaga mutu tanpa menyembunyikan temuan baru. Paket
    # `very_good_analysis` belum dipakai: menggantinya sekaligus
    # memunculkan ratusan temuan gaya pada kode yang sudah jalan —
    # dikerjakan bertahap, bukan satu tembakan.
    #
    # Kesalahan yang paling sering lolos: memakai context setelah await.
    use_build_context_synchronously: true
    # Future yang tidak ditunggu (penyebab "pekerjaan berkas tidak selesai").
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    #
    # ── Lanjutan P3-8 (24 Sep 2026) — diuji dulu, baru dinyalakan ────────
    # 28 aturan kandidat dicoba sekaligus di kode yang sekarang: 19 aturan
    # TIDAK menemukan satu pun temuan → langsung dipakai sebagai gerbang mutu,
    # tanpa menyentuh satu baris kode pun. Sembilan sisanya sengaja BELUM
    # dinyalakan karena menuntut perubahan besar-besaran pada kode yang sudah
    # terbukti jalan (jumlah temuan saat diuji: directives_ordering 164,
    # prefer_const_constructors 76, unnecessary_lambdas 29, prefer_single_quotes 27,
    # avoid_slow_async_io 16, prefer_final_locals 9, prefer_const_declarations 7,
    # sort_constructors_first 6, prefer_const_literals_to_create_immutables 4).
    # Menyalakannya sekarang = riwayat perubahan raksasa tanpa manfaat bagi
    # pengguna; dikerjakan bertahap bila memang dibutuhkan.
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_function_literals_in_foreach_calls: true
    avoid_print: true
    avoid_relative_lib_imports: true
    avoid_unnecessary_containers: true
    no_duplicate_case_values: true
    prefer_is_empty: true
    prefer_typing_uninitialized_variables: true
    require_trailing_commas: true
    sized_box_for_whitespace: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_brace_in_string_interps: true
    unnecessary_const: true
    unnecessary_statements: true
    use_key_in_widget_constructors: true
    use_string_buffers: true
    use_super_parameters: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
#
# ── Tambahan hasil audit 23 Sep 2026 (P3-8) ────────────────────────────────
# Gerbang: `flutter analyze` WAJIB "No issues found!", dan di jalur integrasi
# berkelanjutan dijalankan dengan `--fatal-infos --fatal-warnings`
# (lihat .github/workflows/ci.yml).
