# Mesin build ini punya RAM terbatas: 8G membuat daemon Gradle dibunuh sistem.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Jalur Aaron: mesin build dipakai bersama layanan live -> daemon dimatikan
# supaya RAM tidak tertahan setelah build selesai.
org.gradle.daemon=false
